[project]
name = "self-agent"
version = "0.1.0"
description = "Local-first RAG and agent chat backend"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]
knowledge = [
    "boto3==1.43.99",
    "fastembed==0.7.4",
    "jieba==0.42.1",
    "onnxruntime==1.20.1",
    "psycopg[binary]==3.3.6",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "tiktoken==0.14.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
